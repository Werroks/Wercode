[package]
name = "wercode"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
futures = "0.3"
# Each grammar is compiled in; the list is the languages the editor highlights.
gpui-kit = { version = "0.9.1", features = [
    "tree-sitter-bash", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-css", "tree-sitter-diff",
    "tree-sitter-go", "tree-sitter-html", "tree-sitter-java", "tree-sitter-javascript",
    "tree-sitter-make", "tree-sitter-markdown", "tree-sitter-markdown-inline", "tree-sitter-python",
    "tree-sitter-ruby", "tree-sitter-rust", "tree-sitter-sql", "tree-sitter-toml", "tree-sitter-tsx",
    "tree-sitter-typescript", "tree-sitter-yaml",
] }
wercode-core = { version = "0.1.0", path = "../core" }

[dev-dependencies]
gpui-kit = { version = "0.9.1", features = ["test-support"] }

[build-dependencies]
embed-resource = "3.0.12"
