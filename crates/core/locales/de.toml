"The language server lists nothing in this file." = "Der Sprachserver listet in dieser Datei nichts auf."
"The language server that offered this has stopped." = "Der Sprachserver, der das angeboten hat, wurde beendet."
"Type hints" = "Typhinweise"
"Type the name of a function, type or variable…" = "Name einer Funktion, eines Typs oder einer Variable eingeben…"
"The file changed on disk; look at it again and choose once more." = "Die Datei hat sich auf der Festplatte geändert; sehen Sie sie erneut an und wählen Sie noch einmal."
