"Take back the last change made here" = "Die letzte Änderung hier zurücknehmen"
"{n} files with merge conflicts cannot be shown here; resolve them in the editor." = { one = "{n} Datei mit Merge-Konflikten kann hier nicht angezeigt werden; bitte im Editor auflösen.", other = "{n} Dateien mit Merge-Konflikten können hier nicht angezeigt werden; bitte im Editor auflösen." }
"No conflict markers are left" = "Keine Konfliktmarkierungen mehr"
"{n} conflicts left" = { one = "{n} Konflikt übrig", other = "{n} Konflikte übrig" }
"Mark Resolved" = "Als gelöst markieren"
