"{n} files with merge conflicts cannot be shown here; resolve them in the editor." = "有 {n} 个存在合并冲突的文件无法在此显示；请在编辑器中解决。"
"No conflict markers are left" = "已没有冲突标记"
"{n} conflicts left" = "还剩 {n} 个冲突"
"Mark Resolved" = "标记为已解决"
"Put the file into the index, which tells git the conflict is over" = "将文件加入索引，git 由此得知冲突已解决"
"Resolve the conflicts in the list of all changes" = "在所有更改列表中解决冲突"
"Back to the built-in shortcut" = "恢复内置快捷键"
"Click a shortcut and press the keys you want; Esc cancels. Your shortcuts are kept in the [keys] table of settings.toml." = "点击快捷键并按下想要的按键；Esc 取消。你的快捷键保存在 settings.toml 的 [keys] 表中。"
"Click, then press the new shortcut" = "点击后按下新的快捷键"
"Editor: Show Completions" = "编辑器：显示补全"
"Find a command or a shortcut" = "查找命令或快捷键"
"No command matches." = "没有匹配的命令。"
"No shortcut" = "无快捷键"
"Press the keys… Esc cancels" = "请按键… Esc 取消"
"Programs in the terminal no longer get {keys}." = "终端中的程序将不再收到 {keys}。"
"Remove the shortcut" = "移除快捷键"
"Terminal: Go to the Pane Above" = "终端：转到上方窗格"
"Terminal: Go to the Pane Below" = "终端：转到下方窗格"
"Terminal: Go to the Pane on the Left" = "终端：转到左侧窗格"
"Terminal: Go to the Pane on the Right" = "终端：转到右侧窗格"
"View: Command Palette" = "视图：命令面板"
"{keys} cannot be a shortcut: it would take a key away from typing. Add Ctrl or Alt, or use F1 to F24." = "{keys} 不能作为快捷键：这个键要用来输入文字。请加上 Ctrl 或 Alt，或使用 F1 到 F24。"
"{keys} is also the shortcut of: {commands}." = "{keys} 也是以下命令的快捷键：{commands}。"
"Each worktree is a folder of its own with another branch checked out, so several agents can work at once without getting in each other's way." = "每个 worktree 都是一个单独的文件夹，检出不同的分支，这样多个代理可以同时工作而互不干扰。"
"Git: Switch or Create Worktree…" = "Git：切换或创建 worktree…"
"New worktree: a branch name, then Enter" = "新建 worktree：输入分支名后按 Enter"
"Open in a New Window" = "在新窗口中打开"
"Remove Worktree" = "移除 worktree"
"WORKTREES" = "WORKTREE"
"Worktrees: a folder for each branch" = "Worktree：每个分支一个文件夹"
"its folder is gone" = "其文件夹已不存在"
